name: CI/CD Pipeline - Build, Test & Automated Kubernetes Deployment

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/app/**'
      - 'src/k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: manyajuneja3/devops-microservice
  K8S_NAMESPACE: default

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r src/app/requirements.txt

      - name: Run Code Linter (Flake8)
        run: |
          flake8 src/app/app.py --max-line-length=120 --count --statistics

      - name: Execute Automated Unit Tests
        run: |
          python -c "import src.app.app as app; print('Candidate:', app.STUDENT_NAME, app.STUDENT_ROLL); print('Tests passed!')"

  build-and-publish:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/app
          file: ./src/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kubernetes:
    name: Continuous Deployment to K8s Cluster
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure Kubernetes Cluster Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Update Image Tag in K8s Manifests (Kustomize)
        run: |
          cd src/k8s
          kustomize edit set image devops-microservice=${{ env.IMAGE_NAME }}:${{ needs.build-and-publish.outputs.image_tag }}

      - name: Apply Kubernetes Manifests (Declarative CD)
        run: |
          kubectl apply -k src/k8s/ --namespace ${{ env.K8S_NAMESPACE }}

      - name: Monitor Rolling Update Rollout
        run: |
          kubectl rollout status deployment/web-app-deployment --namespace ${{ env.K8S_NAMESPACE }} --timeout=120s

      - name: Automated Smoke Testing / Health Verification
        run: |
          kubectl get pods -l app=web-app --namespace ${{ env.K8S_NAMESPACE }}
          kubectl get svc web-app-service --namespace ${{ env.K8S_NAMESPACE }}

      - name: Automated Rollback on Deployment Failure
        if: failure()
        run: |
          echo "Deployment failed! Initiating automated rollback for candidate Manya Juneja (2301730142)..."
          kubectl rollout undo deployment/web-app-deployment --namespace ${{ env.K8S_NAMESPACE }}
